# The `ollama` profile: System One decisions from a local Ollama (0.35 or later) instead of
# the hosted Jev API. Activated by OllamaSystemOneDemoApplication.

spring.ai.typesafe.base-url=http://localhost:11434
# Ollama accepts any key; the client needs a non-empty one.
spring.ai.typesafe.api-key=ollama
# nimble (9B), tev1 (4B) or tev1:0.8b; pull it first, e.g. `ollama pull nimble`.
spring.ai.typesafe.model=${OLLAMA_SYSTEMONE_MODEL:nimble}

# The first call loads the model into memory, which can take a while. The retry budget
# must stay above the per-attempt timeout, or no retry can ever fit in it.
spring.ai.typesafe.timeout=60s
spring.ai.typesafe.retry.max-retries=1
spring.ai.typesafe.retry.total-timeout=150s

# No chat model is needed here, so none is configured and no Anthropic key is required.
spring.autoconfigure.exclude=org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
