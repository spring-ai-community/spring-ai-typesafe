site_name: Spring AI TypeSafe
site_description: A Java client and Spring AI integration for the TypeSafe AI System One API
repo_url: https://github.com/spring-ai-community/spring-ai-typesafe
repo_name: spring-ai-community/spring-ai-typesafe
edit_uri: edit/main/docs/

theme:
  name: material
  logo: images/logo2.png
  favicon: images/logo2.png
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Concepts:
    - The Three Primitives: concepts/primitives.md
    - Confidence: concepts/confidence.md
  - Client:
    - TypeSafeClient: client/TypeSafeClient.md
    - Batches: client/Batches.md
    - Errors and Retries: client/ErrorsAndRetries.md
    - Spring Boot Starter: client/SpringBootStarter.md
    - Using Laya: client/Laya.md
  - Model-as-a-Judge:
    - JevJudge: judge/JevJudge.md
    - JevSelfRefineAdvisor: judge/JevSelfRefineAdvisor.md
    - JevEvaluator: judge/JevEvaluator.md
  - Guardrails:
    - JevGuardrailAdvisor: guardrails/JevGuardrailAdvisor.md
  - RAG:
    - JevDocumentFilter: rag/JevDocumentFilter.md
    - JevDocumentReranker: rag/JevDocumentReranker.md
  - Tool Search:
    - JevToolIndex: toolsearch/JevToolIndex.md
  - Chat Model:
    - JevChatModel (experimental): chat/JevChatModel.md
  - Composing Decisions:
    - JevConfidenceGate: patterns/JevConfidenceGate.md
    - JevConsistency: patterns/JevConsistency.md
    - JevCompositeScore: patterns/JevCompositeScore.md
  - Demos: demos.md
  - Changes: changes.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  # The docs.yml workflow publishes with `mike`, which needs this provider for the
  # version selector to appear in the header.
  version:
    provider: mike
    default:
      - latest-snapshot
      - latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/spring-ai-community/spring-ai-typesafe
  generator: false

plugins:
  - search
